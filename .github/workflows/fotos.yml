name: Descargar fotos
# Se lanza a mano (Actions → Descargar fotos → Run workflow).
# Comprueba la licencia de cada foto en Wikimedia Commons, la descarga y guarda los créditos.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fotos.mjs
      - name: Guardar las fotos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/img src/_data/fotos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Descargar fotos con licencia libre de Wikimedia Commons"
          git push
