name: Descargar fotos
# Se lanza solo cuando cambia la lista de fotos (src/_data/fotos-lista.json) o a mano
# (Actions → Descargar fotos → Run workflow).
# Comprueba la licencia de cada foto en Wikimedia Commons, la descarga y guarda los créditos.
on:
  push:
    paths:
      - src/_data/fotos-lista.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fotos.mjs
      - name: Reducir el peso de las fotos
        run: |
          sudo apt-get install -y -qq imagemagick > /dev/null
          mogrify -resize '1400x1400>' -quality 80 -strip -interlace Plane src/img/fotos/*.jpg src/img/secciones/*.jpg
      - name: Guardar las fotos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/img src/_data/fotos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Descargar fotos con licencia libre de Wikimedia Commons"
          git push
