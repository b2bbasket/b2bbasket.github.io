name: Vista previa (temporal)
# Construye la web de las ramas de trabajo y la guarda en la rama «vista-previa-tmp» para revisarla.
# Se borrará al terminar el rediseño.
on:
  push:
    branches: [claude/tanda2, claude/tanda3]
permissions:
  contents: write
concurrency:
  group: vista-previa
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
      - run: |
          cd _site
          git init -q -b vista-previa-tmp
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Vista previa de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vista-previa-tmp
