name: Plantillas de los equipos
# Actualiza las plantillas actuales y los datos de cada jugador (src/_data/plantillas.json)
# desde Wikipedia, Wikidata y Wikimedia Commons. El «Vigilante de datos» lo hace solo una vez al día;
# este flujo sirve para lanzarlo a mano (Actions → Plantillas de los equipos → Run workflow)
# o cuando cambia el script.
on:
  push:
    paths:
      - scripts/plantillas.mjs
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  plantillas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/plantillas.mjs
      - name: Guardar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/_data/plantillas.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar plantillas de los equipos (Wikipedia y Wikidata)"
          git pull --rebase --autostash
          git push
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run publicar.yml; fi
