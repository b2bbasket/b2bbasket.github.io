name: Prueba fotos de jugadores (temporal)
on:
  push:
    branches: [claude/foto-jugador]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          for n in "Stephen Curry" "Luka Dončić" "Aday Mara" "Victor Wembanyama" "Cooper Flagg" "Santi Aldama" "Jalen Brunson" "Shai Gilgeous-Alexander"; do
            s=$(echo "$n" | tr ' ' '-'); printf -- "---\ntitle: prueba\njugador_foto: \"%s\"\n---\n" "$n" > "src/articulos/prueba-$s.md"; done
          node scripts/fotos-jugadores.mjs
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -b prueba-fotos-tmp
          git add src/img/jugadores src/_data/fotos_jugadores.json; git commit -qm "prueba"; git push -f origin prueba-fotos-tmp
