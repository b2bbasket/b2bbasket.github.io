name: Actualizar datos
on:
  schedule:
    # GitHub no garantiza la hora de las tareas programadas: a veces las retrasa o se las salta.
    # Por eso hay varias pasadas cada mañana. Si no hay partidos nuevos, no cambia nada ni publica.
    # Horas en UTC: en invierno, España = UTC+1 (6:47, 7:47, 8:17, 9:17, 11:17).
    - cron: '47 5 * * *'
    - cron: '47 6 * * *'
    - cron: '17 7 * * *'
    - cron: '17 8 * * *'
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: datos-nba
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar.mjs
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      - name: Guardar cambios y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain src/_data)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add src/_data/resultados.json src/_data/clasificacion.json src/_data/calendario.json
            git commit -m "Actualizar resultados, clasificación y calendario"
            git pull --rebase --autostash
            git push
            gh workflow run publicar.yml
          fi
