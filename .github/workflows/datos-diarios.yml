name: Actualizar datos
on:
  schedule:
    # 07:17 UTC = 8:17 en España en invierno (9:17 en verano). Los minutos raros evitan las horas punta de GitHub.
    - cron: '17 7 * * *'
    # Segunda pasada de seguridad por si GitHub retrasa o se salta la primera (si no hay cambios, no hace nada)
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: datos-nba
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar.mjs
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      - name: Guardar cambios y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain src/_data)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add src/_data/resultados.json src/_data/clasificacion.json src/_data/calendario.json
            git commit -m "Actualizar resultados, clasificación y calendario"
            git pull --rebase --autostash
            git push
            gh workflow run publicar.yml
          fi
