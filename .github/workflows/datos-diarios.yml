name: Actualizar datos
on:
  # Las actualizaciones automáticas las hace ahora el «Vigilante de datos» (vigilante.yml).
  # Este flujo queda para lanzarlo a mano: Actions → Actualizar datos → Run workflow.
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: datos-nba
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/actualizar.mjs
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      - name: Guardar cambios y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain src/_data)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add src/_data/resultados.json src/_data/clasificacion.json src/_data/calendario.json
            git commit -m "Actualizar resultados, clasificación y calendario"
            git pull --rebase --autostash
            git push
            gh workflow run publicar.yml
          fi
