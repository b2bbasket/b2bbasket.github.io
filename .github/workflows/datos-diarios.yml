name: Actualizar datos
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar-datos.mjs
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      - name: Guardar cambios y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain src/_data)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add src/_data/resultados.json src/_data/clasificacion.json
            git commit -m "Actualizar resultados y clasificación"
            git push
            gh workflow run publicar.yml
          fi
