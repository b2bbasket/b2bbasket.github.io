name: Calendario en directo
on:
  # El directo lo actualiza ahora el «Vigilante de datos» (vigilante.yml). Este flujo queda para lanzarlo a mano.
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: datos-nba
  cancel-in-progress: false
jobs:
  directo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/calendario-directo.mjs
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      - name: Guardar cambios y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain src/_data/calendario.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add src/_data/calendario.json
            git commit -m "Calendario: actualizar partidos de hoy"
            git pull --rebase --autostash
            git push
            gh workflow run publicar.yml
          fi
