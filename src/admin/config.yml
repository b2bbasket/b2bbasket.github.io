backend:
  name: github
  repo: hugoamigo2006-collab/medio-nba
  branch: main

locale: es
site_url: https://hugoamigo2006-collab.github.io/medio-nba/
media_folder: src/img/subidas
public_folder: /medio-nba/img/subidas

collections:
  - name: articulos
    label: Artículos
    label_singular: Artículo
    folder: src/articulos
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{seccion}}"
    sortable_fields: [date, title]
    fields:
      - { label: Titular, name: title, widget: string }
      - { label: Fecha de publicación, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: Sección
        name: seccion
        widget: select
        options:
          - { label: Noticias, value: noticias }
          - { label: Previas, value: previas }
          - { label: Crónicas, value: cronicas }
          - { label: Análisis, value: analisis }
          - { label: Datos y estadísticas, value: datos }
          - { label: Guías, value: guias }
          - { label: Historias y reportajes, value: historias }
      - { label: Entradilla, name: resumen, widget: text, hint: "Qué ha pasado y por qué importa, en una o dos frases." }
      - { label: Autor, name: autor, widget: string, default: "[Tu nombre]" }
      - { label: Borrador (si está activado, NO se publica), name: borrador, widget: boolean, default: true, required: false }
      - { label: Imagen principal (solo con licencia o autorización), name: imagen, widget: image, required: false }
      - { label: Crédito de la imagen, name: credito, widget: string, required: false }
      - { label: Texto del artículo, name: body, widget: markdown }

  - name: previas
    label: Previas de partido
    label_singular: Previa
    folder: src/previas
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{fields.local}}-vs-{{fields.visitante}}"
    summary: "{{local}} vs {{visitante}}"
    fields:
      - { label: Equipo local, name: local, widget: string }
      - { label: Equipo visitante, name: visitante, widget: string }
      - { label: Fecha del partido, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Día y hora (horario peninsular), name: fecha_hora, widget: string, hint: "Por ejemplo: Lunes 2 de noviembre, 01:30" }
      - { label: Dónde verlo, name: donde, widget: string }
      - { label: Autor, name: autor, widget: string, default: "[Tu nombre]" }
      - { label: Las claves del partido, name: claves, widget: list, required: false, field: { label: Clave, name: clave, widget: string } }
      - { label: Bajas del equipo local, name: bajas_local, widget: list, required: false, field: { label: Jugador, name: jugador, widget: string } }
      - { label: Bajas del equipo visitante, name: bajas_visitante, widget: list, required: false, field: { label: Jugador, name: jugador, widget: string } }
      - { label: Borrador (si está activado, NO se publica), name: borrador, widget: boolean, default: true, required: false }
      - { label: Texto de la previa, name: body, widget: markdown, required: false }

  - name: fichas
    label: Fichas de equipo
    label_singular: Ficha de equipo
    folder: src/fichas
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{nombre}} · {{conferencia}}"
    fields:
      - { label: Nombre del equipo, name: nombre, widget: string, hint: "Igual que en la lista de equipos, por ejemplo Boston Celtics" }
      - { label: Conferencia, name: conferencia, widget: select, options: [Este, Oeste] }
      - { label: División, name: division, widget: select, options: [Atlántico, Central, Sureste, Noroeste, Pacífico, Suroeste] }
      - { label: Año de fundación, name: fundacion, widget: string, required: false }
      - { label: Pabellón, name: pabellon, widget: string, required: false }
      - { label: Títulos de la NBA, name: titulos, widget: string, required: false }
      - { label: Imagen (solo con licencia o autorización), name: imagen, widget: image, required: false }
      - { label: Crédito y licencia de la imagen, name: credito, widget: string, required: false, hint: "Autor, licencia y enlace de origen" }
      - { label: Borrador (si está activado, NO se publica), name: borrador, widget: boolean, default: true, required: false }
      - { label: Historia del equipo, name: body, widget: markdown }

  - name: ajustes
    label: Resultados y ajustes
    files:
      - label: Resultados de la jornada
        name: resultados
        file: src/_data/resultados.json
        fields:
          - { label: Fecha o título del bloque, name: fecha, widget: string }
          - label: Partidos
            name: partidos
            widget: list
            fields:
              - { label: Equipo local, name: local, widget: string }
              - { label: Puntos local, name: pl, widget: number, value_type: int }
              - { label: Equipo visitante, name: visitante, widget: string }
              - { label: Puntos visitante, name: pv, widget: number, value_type: int }
              - { label: Crónica del partido (opcional), name: cronica, widget: relation, collection: articulos, search_fields: [title], value_field: "{{slug}}", display_fields: [title], required: false }
      - label: Clasificación
        name: clasificacion
        file: src/_data/clasificacion.json
        fields:
          - { label: Actualizada el, name: actualizado, widget: string }
          - label: Conferencia Este
            name: este
            widget: list
            summary: "{{fields.equipo}}: {{fields.v}}-{{fields.d}}"
            fields:
              - { label: Equipo, name: equipo, widget: string }
              - { label: Victorias, name: v, widget: number, value_type: int }
              - { label: Derrotas, name: d, widget: number, value_type: int }
          - label: Conferencia Oeste
            name: oeste
            widget: list
            summary: "{{fields.equipo}}: {{fields.v}}-{{fields.d}}"
            fields:
              - { label: Equipo, name: equipo, widget: string }
              - { label: Victorias, name: v, widget: number, value_type: int }
              - { label: Derrotas, name: d, widget: number, value_type: int }
      - label: Salarios
        name: salarios
        file: src/_data/salarios.json
        fields:
          - { label: Temporada, name: temporada, widget: string }
          - { label: Actualizado el, name: actualizado, widget: string }
          - { label: Fuente, name: fuente, widget: string }
          - { label: Enlace de la fuente, name: fuente_url, widget: string, required: false }
          - label: Jugadores (de mayor a menor salario)
            name: jugadores
            widget: list
            summary: "{{fields.jugador}} ({{fields.equipo}})"
            fields:
              - { label: Jugador, name: jugador, widget: string }
              - { label: Equipo, name: equipo, widget: string }
              - { label: Salario en millones de dólares, name: millones, widget: number, value_type: float }
      - label: Datos del medio
        name: site
        file: src/_data/site.json
        fields:
          - { label: Nombre del medio, name: nombre, widget: string }
          - { label: Descripción, name: descripcion, widget: text }
          - { label: Enlace de Instagram, name: instagram, widget: string }
          - { label: Correo de contacto, name: email, widget: string }
          - { label: Mostrar aviso de cookies (solo si hay analítica o publicidad), name: banner_cookies, widget: boolean, default: false }
